name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image
        run: docker build -t menu-famille:ci .
      - name: Démarrer et vérifier
        run: |
          docker run -d --name menu -p 8000:8000 -e APP_PASSWORD=ci-password -e COOKIE_SECURE=false menu-famille:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/healthz
          curl -fs -c jar -H 'Content-Type: application/json' -d '{"password":"ci-password"}' http://127.0.0.1:8000/api/login
          n=$(curl -fs -b jar http://127.0.0.1:8000/api/recipes | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "recettes en bibliothèque : $n"; test "$n" -ge 40
          curl -fs -b jar "http://127.0.0.1:8000/api/plan?days=7" > /dev/null
      - name: Journaux du conteneur
        if: always()
        run: docker logs menu
