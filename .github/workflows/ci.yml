name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]   # sur main, c'est publish.yml qui appelle ce workflow
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image
        uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: .
          load: true
          tags: menu-famille:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrer et vérifier
        run: |
          docker run -d --name menu -p 8000:8000 -e APP_PASSWORD=ci-password -e COOKIE_SECURE=false menu-famille:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/healthz
          curl -fs -c jar -H 'Content-Type: application/json' -d '{"password":"ci-password"}' http://127.0.0.1:8000/api/login
          n=$(curl -fs -b jar http://127.0.0.1:8000/api/recipes | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          echo "recettes en bibliothèque : $n"; test "$n" -ge 60
          curl -fs -b jar "http://127.0.0.1:8000/api/plan?days=7" > /dev/null
      - name: Journaux du conteneur
        if: always()
        run: docker logs menu